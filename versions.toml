# Docs versions served (DOC-1245). Managed by `manifest.py --promote`;
# build-and-deploy reads it and materializes any named-but-missing tag.
# stable     = newest tag, served at /docs/<line> (the one indexed URL).
# enumerated = OLDER tags only, served at /docs/<tag>. The newest is NEVER
#              enumerated -- no byte-identical duplicate tree.
# latest     = whether this line owns the global /docs/latest URL. Only the
#              primary line does; a secondary line (v1) sets false.
stable = "v2.5.18.3"
enumerated = [
  "v2.5.16.3",
]
# Four cuts are deliberately absent from `enumerated`, so none is served. The
# first three were WRONG; the fourth is merely redundant.
#
# v2.5.18.2 -- correct on its own terms, but it documents exactly the same
# product state as v2.5.18.3 (flyte-sdk 2.5.18, flyteplugins-* 2.5.18); .3 only
# improves heading anchors (DOC-1357). Serving it would add a near-duplicate
# tree against the Pages file budget for no reader benefit -- it was stable for
# a few hours and nothing links to it. A pinned version earns its place by
# documenting a distinct product state, which this one does not.
#
# The three below were withheld because their content was wrong, not redundant.
#
# v2.5.19.0 -- flyte 2.5.19 was yanked on PyPI ("should be minor": it added the
# whole flyte.artifacts package in a patch release), so the cut named after it
# documented an API surface nobody can install.
#
# v2.5.18.0 -- corrected the SDK half but still carried the flyteplugins-* 2.5.19
# API reference, which was yanked for the same reason.
#
# v2.5.18.1 -- rolled those plugin pages back, but by restoring the pre-regen
# tree verbatim rather than regenerating, so it serves degraded generator output:
# no signature defaults, an invalid `kwargs: **kwargs`, RST markup rendered
# literally. Superseded by v2.5.18.2, which regenerates at 2.5.18. It was stable
# for about fifteen minutes and nothing links to it, so it is withdrawn rather
# than enumerated -- there is no reason to keep serving a known-degraded tree.
# (DOC-1404.)
#
# All three git tags stay as history; leaving them out here is what stops
# /docs/<tag> serving them. Note `manifest.py --promote` would rotate the
# outgoing stable INTO enumerated -- correct in the normal case, wrong for a
# withdrawal, so these edits are deliberately by hand.
