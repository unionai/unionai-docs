name: Build PR

# PR-build half of the two-stage preview pipeline (DOC-1228).
#
# Runs on `pull_request` and builds the docs, but holds NO
# secrets and performs NO deploy. GitHub does not expose repo secrets to
# pull_request runs from forks, so anything secret-bearing here would fail on
# fork PRs (it failed external PR #1055). Instead this job just builds and
# uploads the dist + PR metadata as an artifact; the trusted companion
# workflow `deploy-pr-preview.yml` picks it up via `workflow_run` (where
# secrets ARE available) and deploys it.
#
# The job name is intentionally "Build and deploy docs" — the same name the
# old single-stage workflow used — so the branch-protection required status
# check keeps matching by check-run name without any reconfiguration.
#
# Build fidelity (DOC-1333): previews default to the cheap SINGLE-VERSION build
# — no /docs/latest, no pinned trees, no versions.json. That is a deliberate,
# documented trade-off (most PRs never touch the assembly), not drift: a PR
# that touches a versioning surface (versions.toml, the unionai-docs-infra
# pointer, data/version-manifest.json, .github/workflows/) gets the FULL
# multi-version assembly (~3x build time) so its preview matches production in
# exactly the dimension under test. Both modes run the same shared script as
# the push deploy (unionai-docs-infra/scripts/ci-build-dist.sh).

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# Opt in early to the Node.js 24 runtime for JavaScript actions (see
# build-and-deploy.yml for the full rationale).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Cancel any in-flight build when a new commit lands on the same PR — only
# the latest commit's preview matters.
concurrency:
  group: build-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    # Name preserved from the original single-stage workflow so the existing
    # branch-protection required status check (matched by check-run name)
    # keeps passing — no admin reconfiguration needed.
    name: "Build and deploy docs"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # Full history + tags (DOC-1333): the versions-mode assembly checks out
          # stable/pinned TAGS in worktrees, and the mode decision diffs against
          # the base branch — both need more than a depth-1 clone.
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.161.1'
          extended: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Print environment
        run: |
          echo "::group::versions"
          hugo version
          python --version
          uv --version
          echo "::endgroup::"

      - name: Build dist
        run: |
          start=$(date +%s)
          # DOC-1333: full assembly only when this PR touches a versioning
          # surface; the pattern list mirrors what the assembly consumes. The
          # triple-dot diff is against the merge-base, so it sees exactly the
          # PR's own changes. LATEST_REF=HEAD so /docs/latest previews THIS
          # PR's content — that is what a preview is for.
          MODE=single
          CHANGED=$(git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" 2>/dev/null || true)
          PATTERN='^(versions\.toml$|unionai-docs-infra$|data/version-manifest\.json$|\.github/workflows/)'
          if echo "$CHANGED" | grep -qE "$PATTERN"; then
            MODE=versions
            echo "versioning surfaces changed by this PR:"
            echo "$CHANGED" | grep -E "$PATTERN" | sed 's/^/  /'
          fi
          echo "PR build mode: $MODE"
          LATEST_REF=HEAD bash unionai-docs-infra/scripts/ci-build-dist.sh "$MODE"

      - name: Check generated links
        run: |
          # The links the GENERATOR writes into dist/. `Check Internal Links`
          # reads content/ and cannot see these: 202 of them pointed at nothing
          # while that job stayed green (DOC-1499, DOC-1511, infra#291).
          # Runs here rather than in its own workflow because it needs the dist
          # this job already built, and a second full Hugo build to check links
          # is not worth the minutes.
          make check-generated-links
          echo "BUILD_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      - name: Check rendered images
        run: |
          # The images the BUILT site serves, resolved the way a browser does --
          # against the page's URL, not the source file's directory. `Check
          # Images` reads content/ and cannot see this: Hugo's render hooks
          # rebase an image src, so a path can be correct in the markdown and
          # wrong in the HTML. unionai-docs#1529 shipped an image that 404s on
          # its own preview while all 15 checks passed (DOC-1515, infra#295).
          # Same reasoning as the link check above: it needs the dist this job
          # already built.
          make check-rendered-images

      - name: Emit build provenance
        if: success()
        run: |
          # Write build-info.json at dist/docs/ (served at /docs/build-info.json
          # once deployed). Lets incident response probe "what version is this?".
          mkdir -p dist/docs
          cat > dist/docs/build-info.json <<EOF
          {
            "builder": "github-actions",
            "repository": "${{ github.repository }}",
            "workflow_file": ".github/workflows/build-pr.yml",
            "run_id": "${{ github.run_id }}",
            "run_url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "commit": "${{ github.event.pull_request.head.sha }}",
            "ref": "${{ github.head_ref }}",
            "event": "${{ github.event_name }}",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat dist/docs/build-info.json

      - name: Build summary
        if: always()
        run: |
          echo "::group::dist tree (top 2 levels)"
          find dist -maxdepth 2 -mindepth 1 -print 2>/dev/null | sort || true
          echo "::endgroup::"
          echo "::group::dist size"
          du -sh dist 2>/dev/null || true
          du -sh dist/docs/v2 dist/docs/v1 2>/dev/null || true
          echo "::endgroup::"
          if [ -n "${BUILD_SECONDS:-}" ]; then
            echo "Build wall time: ${BUILD_SECONDS}s"
          fi

      - name: Write PR metadata
        run: |
          cat > pr-meta.json <<EOF
          {"pr_number": "${{ github.event.pull_request.number }}", "head_sha": "${{ github.event.pull_request.head.sha }}", "head_ref": "${{ github.head_ref }}"}
          EOF

      - name: Upload PR dist artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pr-dist
          path: |
            dist
            pr-meta.json
          if-no-files-found: error
          retention-days: 7
