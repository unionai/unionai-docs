name: Check Build Determinism

# Reproducibility gate (DOC-1357): build each variant twice and require the two
# trees to be byte-identical, modulo the `?v=<timestamp>` asset cache-buster.
#
# Nondeterminism comes from build machinery -- templates, render hooks, the
# Python generators -- not from content, so this runs only when that machinery
# changes: an infra submodule bump, the variant list, or this workflow. The one
# known content-side cause, a `{{< ... >}}` shortcode in a heading, is caught on
# every PR by the much cheaper check-heading-shortcodes.yml.
#
# Reproducible output is what makes diffing built output a reliable way to
# verify an infra change; background churn otherwise drowns the signal.

on:
  pull_request:
    paths:
      - 'unionai-docs-infra'
      - 'makefile.inc'
      - 'Makefile'
      - '.github/workflows/check-determinism.yml'
  push:
    branches: [main]
    paths:
      - 'unionai-docs-infra'
      - 'makefile.inc'
      - 'Makefile'
      - '.github/workflows/check-determinism.yml'

jobs:
  check-determinism:
    name: "Check Build Determinism"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: 'true'

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.161.1'
          extended: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check build determinism
        run: unionai-docs-infra/scripts/check-determinism.sh

      - name: Report status
        if: ${{ failure() }}
        run: |
          echo "::error::The determinism workflow failed. Inspect the failed step above; reproduce the build check locally with 'unionai-docs-infra/scripts/check-determinism.sh'."
